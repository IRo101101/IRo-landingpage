<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Lehrbetrieb - Wir machen Profis">
  <defs>
    <path id="lb-top" d="M 26 100 A 74 74 0 0 1 174 100" fill="none"/>
    <path id="lb-bottom" d="M 28 100 A 72 72 0 0 0 172 100" fill="none"/>
  </defs>
  <g fill="#C5C7C4">
    <!-- Ring -->
    <path d="M100 6 A 94 94 0 1 1 99.9 6 Z" fill="none" stroke="#C5C7C4" stroke-width="3"/>
    <!-- Pfeil nach oben-rechts (fetter NO-Pfeil, Rechteck-Enden) -->
    <path transform="rotate(45 100 100)" d="M100 54 L132 86 L114 86 L114 146 L86 146 L86 86 L68 86 Z" stroke="#C5C7C4" stroke-width="5" stroke-linejoin="round"/>
    <!-- Text -->
    <text font-family="Inter, sans-serif" font-weight="600" font-size="20" letter-spacing="1.5">
      <textPath href="#lb-top" startOffset="50%" text-anchor="middle">Lehrbetrieb</textPath>
    </text>
    <text font-family="Inter, sans-serif" font-weight="600" font-size="18.5" letter-spacing="1">
      <textPath href="#lb-bottom" startOffset="50%" text-anchor="middle">Wir machen Profis</textPath>
    </text>
  </g>
</svg>
